# =============================================
# Server
# =============================================
server.port=8080

# =============================================
# MySQL Database  <-- FILL IN YOUR CREDENTIALS
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate
#   ddl-auto=update -> Hibernate creates/updates tables from your entities
#   switch to validate (or none) in production
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================
# Jackson / JSON
# =============================================
spring.jackson.serialization.write-dates-as-timestamps=false

# =============================================
# JWT  (secret MUST be at least 32 chars / 256 bits in production - change it!)
# =============================================
app.jwt.secret=b026a244b6d07bad8ffb2c9c5e23637a6cbf189395a4a9a3402549895f5f7b7f
# 7 days in milliseconds
app.jwt.expiration-ms=604800000